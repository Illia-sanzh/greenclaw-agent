# Production overlay — adds resource limits, log rotation, and restart policies.
#
# Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The Ansible installer applies this automatically. For manual deployments,
# combine with the base compose and optionally the Astro overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.astro.yml up -d

services:
  greenclaw-agent:
    restart: unless-stopped
    mem_limit: 1152m
    environment:
      LOG_LEVEL: info
      NODE_OPTIONS: "--max-old-space-size=1024"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  greenclaw-bot:
    restart: unless-stopped
    mem_limit: 256m
    environment:
      LOG_LEVEL: info
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  greenclaw-litellm:
    restart: unless-stopped
    mem_limit: 896m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  greenclaw-mcp-runner:
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  greenclaw-relay:
    restart: unless-stopped
    mem_limit: 32m

  greenclaw-squid:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
