# Development override — hot-reload via tsx --watch, higher memory, debug logging.
#
# Docker Compose loads this file automatically alongside docker-compose.yml
# when you run `docker compose up` locally. Do NOT use this in production.
#
# In production, use docker-compose.prod.yml instead:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  greenclaw-agent:
    restart: "no"
    mem_limit: 2048m
    environment:
      LOG_LEVEL: debug
    volumes:
      - ./agent/agent.ts:/app/agent.ts:ro
      - ./agent/src:/app/src:ro
      - ./SKILL.md:/app/SKILL.md:ro
    command: ["node", "--import", "tsx", "--watch", "agent.ts"]

  greenclaw-bot:
    restart: "no"
    mem_limit: 512m
    environment:
      LOG_LEVEL: debug
    volumes:
      - ./telegram-bot/bot.ts:/app/bot.ts:ro
      - ./telegram-bot/src:/app/src:ro
    command: ["node", "--import", "tsx", "--watch", "bot.ts"]

  greenclaw-litellm:
    restart: "no"
    mem_limit: 1024m

  greenclaw-mcp-runner:
    restart: "no"
    mem_limit: 768m

  greenclaw-relay:
    restart: "no"

  greenclaw-squid:
    restart: "no"
