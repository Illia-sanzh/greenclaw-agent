# Astro mode overlay — use with:
#   docker compose -f docker-compose.yml -f docker-compose.astro.yml up -d --build
#
# Replaces WordPress volumes with Astro project mount.
# Disables the relay container (not needed without WordPress).

services:
  greenclaw-agent:
    volumes:
      - ${ASTRO_PROJECT_PATH:?Set ASTRO_PROJECT_PATH in .env}:/astro-project:rw
      - ./ASTRO-SKILL.md:/app/SKILL.md:ro
      - ./greenclaw-config:/app/config:rw
      - agent-tmp:/tmp/wp-agent
      - agent-data:/app/data
      # SSH deploy key for git push — generated by Ansible installer.
      # To set up manually: ssh-keygen -t ed25519 -f ./astro-deploy-key -N ''
      # Then add astro-deploy-key.pub as a Deploy Key in your GitHub repo settings.
      - ./astro-deploy-key:/root/.ssh/id_ed25519:ro
      - ./astro-known-hosts:/root/.ssh/known_hosts:ro
    environment:
      SITE_MODE: astro
      ASTRO_PROJECT_PATH: /astro-project
      ASTRO_GIT_REMOTE: ${ASTRO_GIT_REMOTE:-origin}
      ASTRO_GIT_BRANCH: ${ASTRO_GIT_BRANCH:-main}
      GIT_SSH_COMMAND: "ssh -i /root/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new"

  greenclaw-relay:
    profiles: ["disabled"]
