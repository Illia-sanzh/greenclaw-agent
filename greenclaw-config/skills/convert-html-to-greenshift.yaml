name: convert_html_to_greenshift
description: >
  Convert HTML to Greenshift blocks with CSSRender. Writes result to /tmp/gs_output.txt.
  After this, run: wp post update <ID> /tmp/gs_output.txt
  Do NOT read or modify the output file — use it directly.
type: command
command: "node /app/config/skills/scripts/convert.js {file_path} -o /tmp/_gs_raw.txt && node /app/config/skills/scripts/postprocess.js /tmp/_gs_raw.txt -o /tmp/gs_output.txt"
parameters:
  - name: file_path
    type: string
    description: "Path to the HTML file to convert (e.g. /tmp/design.html)"
    required: true
